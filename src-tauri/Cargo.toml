[package]
name = "runes24"
version = "1.0.0"
description = "Runes Circle"
authors = [ "Ruslan Prakapchuk <fer.obbee@gmail.com>" ]
license = "MIT"
edition = "2021"
build = "src/build.rs"

[build-dependencies]
tauri-build = { version = "1.0.0", features = [] }

[dependencies]
dirs = "4.0.0"
serde = { version = "1.0.137", features = [ "derive" ] }
snap = "1.0.5"
tauri = { version = "1.0.0", features = [] }

[features]
default = [ "custom-protocol" ]
custom-protocol = [ "tauri/custom-protocol" ]

[profile.release]
panic = "abort"
codegen-units = 1
lto = "thin"
incremental = false
opt-level = "s"
